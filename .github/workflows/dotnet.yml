# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # Drafts skip every job (see the job conditions below): agents keep a PR in draft while
    # reviewers review it, so the build and tests run once, on the approved head, when the PR is
    # marked ready. `converted_to_draft` exists only to cancel a run still in progress.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true

permissions:
  contents: write
  id-token: write

# A newer event on the same PR, including conversion to draft, cancels its older run. Pushes to
# main and manual dispatches get a group of their own, so a publishing run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  modularpipeline:
    # Skip drafts before a runner is allocated. Marking the PR ready starts the run that counts.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Verify package dependency compatibility
        shell: pwsh
        run: ./scripts/Test-PackageCompatibility.ps1
      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Pipeline
        run: dotnet run -c Release
        working-directory: "AsyncSemaphore.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish-packages }}

  # The pipeline above covers Linux x64. The library is lock-free, so it also has to be raced where
  # the memory model is weaker (ARM64) and where timers, thread wake-ups and the scheduler differ.
  test-matrix:
    name: Tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    # A lost wake-up shows up as a test that never returns. Fail in minutes, not at the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Unit tests (net8.0, net9.0, net10.0 builds)
        run: dotnet test --project AsyncSemaphore.UnitTests -c Release --max-parallel-test-modules 1
      - name: Unit tests (netstandard2.0 build)
        run: dotnet test --project AsyncSemaphore.UnitTests.NetStandard -c Release

  # The one check branch protection requires, and so the one armed auto-merge waits for. Every CI
  # job feeds it, and it runs on every non-draft PR, so the requirement is never left waiting.
  #
  # The name is an expression on purpose. GitHub evaluates a job's name only when the job runs;
  # a job skipped by `if:` reports its check under the raw expression text instead. A draft run
  # therefore reports `needs.modularpipeline.result != '' && 'CI Passed' || ...` as skipped, never
  # a skipped (and so passing) `CI Passed` that auto-merge could merge on before the ready run
  # registers. A fixed job name, such as `modularpipeline`, does report as skipped on a draft.
  ci-passed:
    name: ${{ needs.modularpipeline.result != '' && 'CI Passed' || 'CI Passed (not run)' }}
    needs: [modularpipeline, test-matrix]
    # always(): a failed or cancelled job must still produce a failing `CI Passed`.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::CI jobs did not succeed: $(echo "$failed" | paste -sd ' ')"
            exit 1
          fi
