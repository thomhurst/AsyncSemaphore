# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish packages?    
        type: boolean
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  modularpipeline:
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run Pipeline
        run: dotnet run -c Release
        working-directory: "AsyncSemaphore.Pipeline"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.publish-packages }}

  # The pipeline above covers Linux x64. The library is lock-free, so it also has to be raced where
  # the memory model is weaker (ARM64) and where timers, thread wake-ups and the scheduler differ.
  test-matrix:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A lost wake-up shows up as a test that never returns. Fail in minutes, not at the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Unit tests (net8.0, net9.0, net10.0 builds)
        run: dotnet test --project AsyncSemaphore.UnitTests -c Release --max-parallel-test-modules 1
      - name: Unit tests (netstandard2.0 build)
        run: dotnet test --project AsyncSemaphore.UnitTests.NetStandard -c Release
